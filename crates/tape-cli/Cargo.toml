[package]
name = "tape-cli"
description = "Command-line interface for tape"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "tape"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
tape-core = { version = "0.1.0", path = "../tape-core" }
tape-data = { version = "0.1.0", path = "../tape-data" }

[lints]
workspace = true
