[package]
name = "tape-cli"
description = "Command-line interface for tape"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "tape"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
tape-core = { version = "0.1.0", path = "../tape-core" }
tape-data = { version = "0.1.0", path = "../tape-data" }
tape-engine = { version = "0.1.0", path = "../tape-engine" }
tape-metrics = { version = "0.1.0", path = "../tape-metrics" }
tape-strategies = { version = "0.1.0", path = "../tape-strategies" }
serde_json.workspace = true
tape-wasm = { version = "0.1.0", path = "../tape-wasm" }
tape-lab = { version = "0.1.0", path = "../tape-lab" }

[lints]
workspace = true
