[workspace]
resolver = "3"
members = ["crates/*"]
# Strategies compiled to WebAssembly; each is its own workspace.
exclude = ["guests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Victor Arowo"]
repository = "https://github.com/VictorArowo/tape"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
# Denied everywhere except tape-guest, which needs it at the WebAssembly
# boundary and opts in explicitly.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
