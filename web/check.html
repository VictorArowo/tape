<!doctype html>
<meta charset="utf-8">
<title>tape engine check</title>
<pre id="out">loading…</pre>
<script type="module">
  import { createEngine, createWorkerEngine } from "./tape-engine.js";
  import { examples } from "./strategies.js";
  const out = document.getElementById("out");
  const lines = [];
  try {
    const engine = await createEngine({ base: "./" });
    const execution = { latencyMs: 100, feeBps: 10, slippageBps: 2, participationPct: 10, fillOnTouch: false };
    for (const [strategy, extra] of [["sma", { fast: 20, slow: 100 }], ["meanrev", { window: 60, band: 2 }], ["breakout", { lookback: 240 }], ["hold", {}]]) {
      const r = await engine.run({ strategy, ...extra, month: "2024-01", execution });
      lines.push(`${strategy.padEnd(9)} return ${(r.stats.totalReturn * 100).toFixed(2)}%  naive ${(r.stats.naiveReturn * 100).toFixed(2)}%  trades ${r.stats.trades}  points ${r.equity.length}  ${r.elapsedMs.toFixed(0)} ms  ${r.runHash}`);
    }
    const r = await engine.run({ strategy: "sma", fast: 20, slow: 100, month: "2024-07", execution });
    lines.push(`second month loaded: ${r.dates[0]} → ${r.dates.at(-1)}`);

    // Custom strategies, in a worker that stops runaway code.
    const worker = createWorkerEngine({ base: "./", timeoutMs: 2000 });
    for (const example of examples) {
      const c = await worker.run({ strategy: "custom", code: example.code, month: "2024-01", execution });
      lines.push(`custom ${example.id.padEnd(9)} return ${(c.stats.totalReturn * 100).toFixed(2)}%  trades ${c.stats.trades}  ${c.elapsedMs.toFixed(0)} ms  ${c.runHash}`);
    }
    const started = performance.now();
    try {
      await worker.run({ strategy: "custom", code: "function onBar() { while (true) {} }", month: "2024-01", execution });
      throw new Error("an endless loop wasn't stopped");
    } catch (err) {
      if (err.name !== "StrategyError") throw err;
      lines.push(`endless loop stopped after ${((performance.now() - started) / 1000).toFixed(1)} s: ${err.message}`);
    }
    try {
      await worker.run({ strategy: "custom", code: "function onBar(bar, ctx) {\n  ctx.buy(ctx.nope());\n}", month: "2024-01", execution });
    } catch (err) {
      lines.push(`error from the worker: ${err.name}, line ${err.line}: ${err.message}`);
    }
    const again = await worker.run({ strategy: "custom", code: examples[0].code, month: "2024-01", execution });
    lines.push(`fresh worker after the stop: ${again.runHash} (${again.runHash === "b041ccbf3b22c38c" ? "matches native" : "DIFFERENT"})`);
    lines.push("OK");
  } catch (err) {
    lines.push("ERROR " + err.message);
  }
  out.textContent = lines.join("\n");
</script>
